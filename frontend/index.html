<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora AI Chatbot</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">

        <div class="chat-container">


            <!-- ==========================
                 HEADER
            =========================== -->

            <header class="chat-header">

                <div class="brand">

                    <div class="logo">
                        🤖
                    </div>


                    <div>

                        <h1>
                            Nexora AI
                        </h1>


                        <p>

                            <span class="online-dot"></span>

                            Powered by Nexora

                        </p>

                    </div>

                </div>


                <button id="clearBtn" class="clear-btn" type="button">

                    🗑️ Clear

                </button>

            </header>



            <!-- ==========================
                 CHAT AREA
            =========================== -->

            <main id="chatBox" class="chat-box">

                <div class="message bot-message">

                    <div class="avatar bot-avatar">
                        🤖
                    </div>


                    <div class="message-content">

                        <div class="message-name">
                            Nexora
                        </div>


                        <div class="message-text">

                            Hello! 👋

                            <br>

                            I'm your AI assistant.
                            How can I help you today?

                        </div>

                    </div>

                </div>

            </main>



            <!-- ==========================
                 INPUT
            =========================== -->

            <div class="input-area">

                <textarea id="messageInput" placeholder="Message Nexora..." rows="1" autocomplete="off"></textarea>


                <button id="sendBtn" class="send-btn" type="button">

                    <span>
                        Send
                    </span>

                    <span>
                        ➤
                    </span>

                </button>

            </div>



            <!-- ==========================
                 FOOTER
            =========================== -->

            <div class="footer">

                Nexora AI •
                Enter to send •
                Shift + Enter for new line

            </div>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
